<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tetris.css">
</head>
<body>
    <div id="app">
        <a href="/" class="back-btn">← Back</a>
        <div id="game-wrapper">
            <div id="side-left">
                <div class="info-box">
                    <span class="info-label">HOLD</span>
                    <canvas id="hold-canvas" width="100" height="80"></canvas>
                </div>
            </div>
            <div id="board-frame">
                <canvas id="board" width="300" height="600"></canvas>
            </div>
            <div id="side-right">
                <div class="info-box">
                    <span class="info-label">NEXT</span>
                    <canvas id="next-canvas" width="100" height="240"></canvas>
                </div>
                <div class="info-box">
                    <span class="info-label">SCORE</span>
                    <span class="info-value" id="score">0</span>
                </div>
                <div class="info-box">
                    <span class="info-label">LEVEL</span>
                    <span class="info-value" id="level">1</span>
                </div>
                <div class="info-box">
                    <span class="info-label">LINES</span>
                    <span class="info-value" id="lines">0</span>
                </div>
            </div>
        </div>
        <div id="mobile-controls">
            <button class="ctrl" id="ctrl-left">◄</button>
            <button class="ctrl" id="ctrl-down">▼</button>
            <button class="ctrl" id="ctrl-rotate">↻</button>
            <button class="ctrl" id="ctrl-right">►</button>
            <button class="ctrl wide" id="ctrl-drop">DROP</button>
        </div>
        <div id="overlay" class="hidden">
            <div class="overlay-box">
                <h2>GAME OVER</h2>
                <p id="final-score">Score: 0</p>
                <button id="restart-btn" class="btn-play">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    <script src="/error-logger.js"></script>
    <script src="tetris.js"></script>
</body>
</html>
