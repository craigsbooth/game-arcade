<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kart Racing</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Nunito',sans-serif;background:#222;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        #app{position:relative;display:flex;flex-direction:column;align-items:center}
        .back-btn{position:fixed;top:10px;left:10px;z-index:100;font-weight:700;font-size:13px;color:rgba(255,255,255,0.6);text-decoration:none;padding:6px 14px;border-radius:16px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15)}
        #canvas{display:block;border-radius:4px}
        #hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:16px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:#fff;text-shadow:1px 1px 2px #000;z-index:5;pointer-events:none}
        .hud-box{padding:4px 10px;background:rgba(0,0,0,0.5);border-radius:6px}
        #speed-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:150px;height:8px;background:rgba(0,0,0,0.5);border-radius:4px;overflow:hidden}
        #speed-fill{height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);width:0%;transition:width 0.1s;border-radius:4px}
        #lap-display{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:28px;color:#fbbf24;text-shadow:2px 2px 0 #000;z-index:5;pointer-events:none;opacity:0;transition:opacity 0.3s}
    </style>
</head>
<body>
    <div id="app">
        <a href="/" class="back-btn">← Back</a>
        <div id="hud">
            <div class="hud-box">LAP <span id="lap">1</span>/3</div>
            <div class="hud-box">POS <span id="pos">4</span>/4</div>
            <div class="hud-box"><span id="time">0:00</span></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="speed-bar"><div id="speed-fill"></div></div>
        <div id="lap-display"></div>
    </div>
    <script src="/error-logger.js"></script>
    <script src="/highscores.js"></script>
    <script src="kart.js"></script>
</body>
</html>
