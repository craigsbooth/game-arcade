<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinball</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pinball.css">
</head>
<body>
    <div id="app">
        <a href="/" class="back-btn">← Back</a>
        <div id="game-wrapper">
            <canvas id="canvas"></canvas>
            <div id="hud">
                <div class="hud-item">
                    <span class="hud-label">SCORE</span>
                    <span class="hud-value" id="score">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">BALLS</span>
                    <span class="hud-value" id="balls">3</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">BEST</span>
                    <span class="hud-value" id="best">0</span>
                </div>
            </div>
        </div>
        <div id="controls-hint">
            <span>← → Flippers</span> · <span>Space = Launch</span>
        </div>
        <div id="overlay" class="hidden">
            <div class="overlay-box">
                <h2 id="overlay-title">GAME OVER</h2>
                <p id="overlay-score">Score: 0</p>
                <button id="play-again" class="btn-play">PLAY AGAIN</button>
            </div>
        </div>
    </div>
    <script src="/error-logger.js"></script>
    <script src="pinball.js"></script>
</body>
</html>
