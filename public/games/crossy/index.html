<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crossy Road</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Nunito',sans-serif;background:#4a7c2e;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        #app{display:flex;flex-direction:column;align-items:center;gap:8px}
        .back-btn{position:fixed;top:12px;left:12px;z-index:100;font-weight:700;font-size:14px;color:rgba(255,255,255,0.7);text-decoration:none;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.2)}
        #score-display{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:48px;color:#fff;text-shadow:2px 3px 0 rgba(0,0,0,0.3);z-index:10;pointer-events:none}
        #canvas{display:block;border-radius:4px;cursor:pointer}
        #msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Fredoka One',cursive;font-size:20px;color:#fff;text-shadow:1px 2px 0 rgba(0,0,0,0.3);z-index:10;pointer-events:none;text-align:center}
    </style>
</head>
<body>
    <div id="app" style="position:relative">
        <a href="/" class="back-btn">← Back</a>
        <div id="score-display">0</div>
        <canvas id="canvas"></canvas>
        <div id="msg">Tap or ↑ to hop forward</div>
    </div>
    <script src="/error-logger.js"></script>
    <script src="/highscores.js"></script>
    <script src="crossy.js"></script>
</body>
</html>
