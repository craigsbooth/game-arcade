<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Doodle Jump</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Nunito',sans-serif;background:#f5f0d0;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        #app{position:relative}
        .back-btn{position:fixed;top:12px;left:12px;z-index:100;font-weight:700;font-size:14px;color:rgba(0,0,0,0.4);text-decoration:none;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.1)}
        #score-display{position:absolute;top:10px;right:14px;font-family:'Fredoka One',cursive;font-size:24px;color:#2d5016;z-index:10;pointer-events:none}
        #canvas{display:block;border:2px solid #c9c090;border-radius:4px}
    </style>
</head>
<body>
    <div id="app">
        <a href="/" class="back-btn">← Back</a>
        <div id="score-display">0</div>
        <canvas id="canvas"></canvas>
    </div>
    <script src="/error-logger.js"></script>
    <script src="/highscores.js"></script>
    <script src="doodle.js"></script>
</body>
</html>
