<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Run</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Nunito',sans-serif;background:#5c94fc;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        #app{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px}
        .back-btn{position:fixed;top:12px;left:12px;z-index:100;font-weight:700;font-size:14px;color:rgba(255,255,255,0.8);text-decoration:none;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.2)}
        #hud{display:flex;gap:24px;font-weight:800;font-size:14px;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,0.3)}
        #hud span{color:#fbbf24}
        #canvas{display:block;border-radius:4px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,0.2)}
        #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:10;border-radius:4px}
        #overlay.hidden{display:none}
        .ov-box{text-align:center;padding:30px 40px;border-radius:16px;background:#1a1a2e;border:2px solid rgba(251,191,36,0.3)}
        .ov-box h2{font-family:'Fredoka One',cursive;font-size:26px;color:#fbbf24;margin-bottom:8px}
        .ov-box p{color:rgba(255,255,255,0.5);margin-bottom:14px}
        .ov-btn{font-family:'Fredoka One',cursive;font-size:15px;padding:12px 30px;border:none;border-radius:26px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;cursor:pointer}
        #start-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Fredoka One',cursive;font-size:20px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.3);z-index:5;pointer-events:none;animation:pulse 1.5s infinite}
        #start-msg.hidden{display:none}
        @keyframes pulse{0%,100%{opacity:0.8}50%{opacity:1}}
    </style>
</head>
<body>
    <div id="app">
        <a href="/" class="back-btn">← Back</a>
        <div id="hud">
            <div>COINS <span id="coins">0</span></div>
            <div>SCORE <span id="score">0</span></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="start-msg">Tap or Space to Jump!</div>
        <div id="overlay" class="hidden">
            <div class="ov-box">
                <h2>GAME OVER</h2>
                <p id="ov-stats">Score: 0</p>
                <button class="ov-btn" id="retry-btn">RETRY</button>
            </div>
        </div>
    </div>
    <script src="/error-logger.js"></script>
    <script src="/highscores.js"></script>
    <script src="mario.js"></script>
</body>
</html>
